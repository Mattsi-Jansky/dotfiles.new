"$schema" = 'https://starship.rs/config-schema.json'

# Recreates my old Powerlevel10k "classic" prompt (~/.p10k.zsh, 2022):
#
#   ╭─ [dotfiles-new > master ⇡1 !2] ──────── [✔ < 4s < 🐍 v3.10.12 < 17:09:00]
#   ╰─ █
#
# Grey (238) powerline segments, a two-line frame joined by a solid gap, and a
# blank line before each prompt. Colours are 256-colour indices from the p10k
# config.

format = """
[╭─](fg:242)\
$directory\
($git_branch$git_status[ ](bg:238))\
[\uE0B0](fg:238) \
$fill \
[\uE0B2](fg:238)\
$status\
$cmd_duration\
$jobs\
$python\
$nodejs\
$rust\
$golang\
$java\
$php\
$dotnet\
$ruby\
$terraform\
([\uE0B3 ](fg:246 bg:238)$username$hostname[ ](bg:238))\
$time
[╰─](fg:242) """

add_newline = true

[fill]
symbol = "─"
style = "fg:242"

# ── Left ──────────────────────────────────────────────────────────────────────

# Inside a repo: path from the repo root ("dotfiles-new", "dotfiles-new/steps").
# Elsewhere: the last 3 folders.
[directory]
style = "fg:31 bg:238"
before_repo_root_style = "fg:31 bg:238"
repo_root_style = "bold fg:39 bg:238"
read_only = " ∅"
read_only_style = "fg:178 bg:238"
format = "[ $path]($style)[$read_only]($read_only_style)[ ]($style)"
repo_root_format = "[ $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)[ ]($style)"

[git_branch]
style = "fg:76 bg:238"
format = "[\uE0B1 ](fg:246 bg:238)[$symbol$branch]($style)"

# Counts for ahead/behind origin, stashes, and working-tree changes. Each only
# appears when non-zero, so an in-sync clean repo shows just the branch.
[git_status]
style = "fg:178 bg:238"
format = "([$ahead_behind$stashed$conflicted$staged$modified$renamed$deleted$untracked]($style))"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇣${behind_count}⇡${ahead_count}"
up_to_date = ""
stashed = " *${count}"
conflicted = " ~${count}"
staged = " +${count}"
modified = " !${count}"
renamed = " »${count}"
deleted = " ✘${count}"
untracked = " ?${count}"

# ── Right ─────────────────────────────────────────────────────────────────────

[status]
disabled = false
map_symbol = true
recognize_signal_code = true
style = "bg:238"
format = "[ $symbol ]($style)"
success_symbol = "[✔](fg:70 bg:238)"
symbol = "[✘ $status](fg:160 bg:238)"
not_executable_symbol = "[✘ $status](fg:160 bg:238)"
not_found_symbol = "[✘ $status](fg:160 bg:238)"
sigint_symbol = "[✘ INT](fg:160 bg:238)"
signal_symbol = "[✘ $signal_name](fg:160 bg:238)"

[cmd_duration]
min_time = 2_000
style = "fg:248 bg:238"
format = "[\uE0B3 ](fg:246 bg:238)[$duration ]($style)"

[jobs]
symbol = "≡"
style = "fg:37 bg:238"
format = "[\uE0B3 ](fg:246 bg:238)[$symbol ]($style)"

# Language versions: each shows only in a project that uses it (Starship's
# default detection and symbols).
[python]
style = "fg:37 bg:238"
format = "[\uE0B3 ](fg:246 bg:238)[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"

[nodejs]
style = "fg:70 bg:238"
format = "[\uE0B3 ](fg:246 bg:238)[$symbol($version )]($style)"

[rust]
style = "fg:173 bg:238"
format = "[\uE0B3 ](fg:246 bg:238)[$symbol($version )]($style)"

[golang]
style = "fg:37 bg:238"
format = "[\uE0B3 ](fg:246 bg:238)[$symbol($version )]($style)"

[java]
style = "fg:32 bg:238"
format = "[\uE0B3 ](fg:246 bg:238)[$symbol($version )]($style)"

[php]
style = "fg:99 bg:238"
format = "[\uE0B3 ](fg:246 bg:238)[$symbol($version )]($style)"

[dotnet]
style = "fg:134 bg:238"
format = "[\uE0B3 ](fg:246 bg:238)[$symbol($version )(\U0001F3AF $tfm )]($style)"

[ruby]
style = "fg:168 bg:238"
format = "[\uE0B3 ](fg:246 bg:238)[$symbol($version )]($style)"

[terraform]
style = "fg:38 bg:238"
format = "[\uE0B3 ](fg:246 bg:238)[$symbol$workspace ]($style)"

# user@host, shown only as root or over SSH (same as p10k's context segment).
[username]
style_user = "fg:180 bg:238"
style_root = "fg:178 bg:238"
format = "[$user]($style)"

[hostname]
style = "fg:180 bg:238"
format = "[@$hostname]($style)"

[time]
disabled = false
time_format = "%H:%M:%S"
style = "fg:66 bg:238"
format = "[\uE0B3 ](fg:246 bg:238)[$time ]($style)"
